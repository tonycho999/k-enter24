# .github/workflows/auto_post.yml
name: Auto K-Culture Bot (1 at a time)

on:
  schedule:
    # 1시간마다(매시 6분) 1번씩 깨어나서 확인합니다.
    - cron: '6 * * * *'
  workflow_dispatch:

jobs:
  run_single_category:
    runs-on: ubuntu-latest
    steps:
    - name: 체크아웃
      uses: actions/checkout@v4
    
    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 필수 패키지 설치
      # 🚀 맨 끝에 beautifulsoup4 추가했습니다!
      run: pip install requests psycopg2-binary groq google-generativeai beautifulsoup4
      
    - name: 순서에 맞춰 딱 1개만 실행!
      env:
        NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
        GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
        GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
        GROQ_API_KEY4: ${{ secrets.GROQ_API_KEY4 }}
        GROQ_API_KEY5: ${{ secrets.GROQ_API_KEY5 }}
        GROQ_API_KEY6: ${{ secrets.GROQ_API_KEY6 }}
        GROQ_API_KEY7: ${{ secrets.GROQ_API_KEY7 }}
        GROQ_API_KEY8: ${{ secrets.GROQ_API_KEY8 }}
      run: |
        python scripts/run_next.py
